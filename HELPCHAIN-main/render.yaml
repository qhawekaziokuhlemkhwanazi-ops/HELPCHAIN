services:
  - type: web
    name: helpchain-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./HELPCHAIN-main/Dockerfile.api
    dockerContext: ./HELPCHAIN-main
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: EMAIL_OTP_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "2587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DONATION_EXPIRY_SECRET
        sync: false
